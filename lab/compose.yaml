name: incidentlab

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      DATABASE_URL: postgresql://lab:lab@db:5432/lab
    volumes:
      - /srv/lab-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
